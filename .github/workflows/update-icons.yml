name: Update Tabler Icons

# GitHub cannot trigger on releases of another repository, so the npm registry
# is polled once a day. A new release yields a pull request whose body holds
# the release notes; nothing is pushed to main directly.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: 'Tabler Icons release, e.g. "3.52.0"'
        default: latest

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-icons

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Import release
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          go run ./internal/tablerupdate -version "$VERSION" -notes "$RUNNER_TEMP/notes.md"
          go generate -run iconconst ./...

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Icons are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(jq -r .version tabler.json)
          branch="update/tabler-icons-$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists, a pull request is pending."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::Files changed without a new Tabler release; run go generate locally and commit."
            exit 1
          fi
          {
            echo "changed=true"
            echo "version=$version"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.diff.outputs.version }}
          BRANCH: ${{ steps.diff.outputs.branch }}
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo "Created by the update-icons workflow; gofmt, vet and tests passed in that run."
            echo "Unresolved removals can get a manual alias in \`tabler.json\` on this branch (then \`go run ./internal/tablerupdate -offline\`)."
          } > "$RUNNER_TEMP/body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "feat: update Tabler Icons to $VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "feat: update Tabler Icons to $VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
